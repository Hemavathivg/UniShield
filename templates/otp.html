{% extends "base.html" %}

{% block content %}

<div class="login card">

    <h1>🔐 OTP Verification</h1>

    <p class="muted">
        Password verified successfully.
        Enter the OTP generated for your account.
    </p>

    <form method="post">

        <label>Enter OTP</label>

        <input
            type="text"
            name="otp"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="Enter 6-digit OTP"
            required
        >

        <button type="submit">Verify OTP</button>

    </form>

</div>

{% endblock %}
